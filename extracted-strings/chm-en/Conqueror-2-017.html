</h3>



<a name="wp9000090"> </a><p class="pBody">
Press <span class="cButton">Delete</span>
 to permanently erase the selected message.
</p>
<a name="wp9000091"> </a><div class="pNote">
To perform this action, the <span class="cLabel">Access to the System Log and Delete User Messages</span>
 privilege is required.
</div>
